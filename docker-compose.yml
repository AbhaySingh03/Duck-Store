services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: duckstore
      POSTGRES_USER: duck
      POSTGRES_PASSWORD: duck
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U duck -d duckstore"]
      interval: 5s
      timeout: 5s
      retries: 20

  app:
    build: ./backend          # Spring Boot API + the HTML/CSS/JS frontend in one jar
    environment:
      DB_URL: jdbc:postgresql://db:5432/duckstore
      DB_USER: ${DB_USER:postgres}
      DB_PASSWORD: ${DB_PASSWORD:postgres}
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8080:8080"

volumes:
  db-data:
