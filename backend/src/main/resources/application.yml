spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/duckstore}
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:postgres}
  jpa:
    hibernate:
      ddl-auto: update
    database-platform: org.hibernate.dialect.PostgreSQLDialect
  flyway:
    enabled: true
server:
  port: 8081
