<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Duck Warehouse</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
<main>
  <h1>Duck Warehouse</h1>

  <div class="toolbar"><button id="add-btn" class="primary">Add duck</button></div>

  <p id="notice" class="notice" role="status" hidden></p>
  <p id="page-error" class="error" role="alert" hidden></p>

  <!-- One form for both adding and editing -->
  <form id="duck-form" class="panel form" novalidate hidden>
    <h2 id="form-title">Add duck</h2>
    <label>Color
      <select id="color"></select>
    </label>
    <label>Size
      <select id="size"></select>
    </label>
    <label>Price (USD)
      <input id="price" inputmode="decimal" placeholder="200.00">
    </label>
    <label>Quantity
      <input id="quantity" inputmode="numeric" placeholder="10">
    </label>
    <p id="form-hint" class="hint">If a duck with the same color, size and price exists, the quantity is added to it.</p>
    <p id="form-error" class="error" role="alert" hidden></p>
    <div class="buttons">
      <button type="submit" id="save-btn" class="primary">Add duck</button>
      <button type="button" id="cancel-btn">Cancel</button>
    </div>
  </form>

  <div class="table-wrap">
    <table>
      <thead>
        <tr>
          <th>Id</th><th>Color</th><th>Size</th>
          <th class="num">Price</th>
          <th class="num"><button id="sort-btn" class="link sort" title="Change sort order">Quantity ▼</button></th>
          <th>Actions</th>
        </tr>
      </thead>
      <tbody id="rows"></tbody>
    </table>
  </div>
  <p id="empty" class="empty" hidden>No ducks in the warehouse yet. Use “Add duck” to stock the first one.</p>

  <dialog id="confirm" class="dialog">
    <p id="confirm-text"></p>
    <div class="buttons">
      <button id="confirm-yes" class="danger-solid">Delete duck</button>
      <button id="confirm-no">Keep it</button>
    </div>
  </dialog>
</main>
<script src="app.js"></script>
</body>
</html>
